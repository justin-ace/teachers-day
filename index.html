<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="icon" type="image/jpeg" href="assets/image/flowers/dudu_favicon.JPG">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#171b38; --night2:#232a52; --lamp:#ffd78a; --rose:#eaa6b4; --paper:#fbeeea; --ink:#3a2a38; --text:#ece8f2;
}
:root:not([data-theme="light"]){}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;min-height:100svh;background:var(--night);color:var(--text);
  font-family:"Lora",Georgia,serif;line-height:1.7;overflow-x:hidden;
}
/* the lamp: one slow moment on load */
.glow{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle 420px at var(--x,50%) var(--y,18%),rgba(255,215,138,.22),transparent 70%);
  opacity:0;animation:lampOn 3s .4s ease-in forwards;
}
@keyframes lampOn{0%{opacity:0}30%{opacity:.3}38%{opacity:.1}55%{opacity:.8}100%{opacity:1}}
main{position:relative;max-width:640px;margin:0 auto;padding:clamp(3rem,10vh,5.5rem) 1.5rem calc(4rem + env(safe-area-inset-bottom,0px));text-align:left}
h1{font-family:"Caveat",cursive;font-weight:700;font-size:clamp(3rem,12vw,5rem);line-height:1;margin:0 0 1.4rem;color:var(--lamp)}
.intro{font-style:italic;max-width:30rem;margin:0 0 3rem;opacity:.9}
.hint{font-size:.95rem;opacity:.65;margin:0 0 1.2rem}
.letters{display:grid;gap:1.1rem}
.env{
  font:inherit;color:var(--ink);text-align:left;cursor:pointer;border:0;width:100%;
  background:linear-gradient(160deg,#f6dcd8,var(--paper));padding:1.2rem 1.4rem 1.2rem 1.4rem;border-radius:3px;
  position:relative;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .25s;display:block;overflow:hidden;
}
.env::before{ /* envelope flap */
  content:"";position:absolute;left:0;right:0;top:0;height:46px;background:rgba(0,0,0,.05);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .3s;
}
.env::after{content:"";position:absolute;right:1.1rem;top:.9rem;width:18px;height:18px;border-radius:50%;background:#c95b6f;box-shadow:inset -2px -2px 3px rgba(0,0,0,.25)}
.env:hover{transform:translateY(-4px) rotate(-.4deg)}
.env:hover::before{transform:scaleY(-.6)}
.env:focus-visible,.close:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.env small{display:block;font-size:.85rem;opacity:.65}
.env span{font-family:"Caveat",cursive;font-size:1.9rem;font-weight:700;line-height:1.2;display:block;padding-top:1.8rem;padding-right:2rem}
.end{margin-top:3.5rem;font-style:italic;opacity:.7}

dialog{
  border:0;padding:0;width:min(480px,calc(100vw - 2rem));max-height:88vh;max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 2rem);background:var(--paper);color:var(--ink);
  box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:auto;overscroll-behavior:contain;
}
dialog[open]{animation:rise .6s cubic-bezier(.2,.9,.3,1)}
dialog::backdrop{background:rgba(8,10,25,.82)}
@keyframes rise{from{transform:translateY(60px) scale(.96);opacity:0}}
.letter{display:flex;flex-direction:column;min-height:min(420px,calc(88vh - 2rem));min-height:min(420px,calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 4rem));padding:2rem 1.8rem 1.6rem}
.letter h2{font-family:"Caveat",cursive;font-size:2rem;margin:0 0 .8rem;color:#b34a60}
#body{margin:0;white-space:pre-wrap;font-size:1.08rem;min-height:12rem;flex:1 0 auto}
.sign{font-family:"Caveat",cursive;font-size:1.8rem;line-height:1.2;white-space:pre-line;text-align:right;margin:auto 0 0;color:#b34a60;padding-top:.8rem}
.close{font:inherit;font-size:.95rem;background:none;border:0;color:inherit;opacity:.7;text-decoration:underline;cursor:pointer;padding:0;margin-top:.6rem}
@media (max-width:480px){
  main{padding-left:1.1rem;padding-right:1.1rem}
  h1{font-size:clamp(3rem,15vw,4rem);margin-bottom:1rem}
  .intro{margin-bottom:2rem}
  .hint{font-size:.88rem;margin-bottom:1rem}
  .letters{gap:.85rem}
  .env{padding:1rem 1.1rem}
  .env span{font-size:1.75rem;padding-top:1.6rem}
  .letter{padding:1.5rem 1.25rem 1.2rem}
  #body{font-size:1rem;min-height:9rem}
  .sign{font-size:1.65rem}
}
@media (max-height:600px){
  .letter{min-height:0}
  #body{min-height:5rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.glow{opacity:1}}
</style>
</head>
<body>
<div class="glow" id="glow" aria-hidden="true"></div>
<main>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <p class="hint">Open a letter!.</p>
  <div class="letters" id="letters"></div>
  <p class="end">Happy Teachers' Day.</p>
</main>

<dialog id="dlg" aria-labelledby="dt">
  <div class="letter">
    <h2 id="dt"></h2>
    <p id="body"></p>
    <p class="sign" id="sign"></p>
    <button class="close" id="close">Fold it back up</button>
  </div>
</dialog>

<script>
/* ---- Make it yours: change the names and every line below ---- */
const HER = "Monaaa";
const ME  = "Jaceee";
const INTRO = "For the love of my life. I love youuu. 🖤";
const LETTERS = [
  { label:"Open when you want a little reminder of us",
    text:`Just a little reminder that you're loved.\n\nI love you, I miss you, and I'm really glad I have you.\n\nThat's it. That's the message. I just wanted you to hear it again.` },
  { label:"Open when you doubt yourself",
    text:`You are enough. You always have been, even on the days it doesn't feel like it.\n\nYou care deeply, you try so hard, and you don't give yourself nearly enough credit for it.\n\nI see all of it. I'd like you to see it too.` },
  { label:"Open when you need to hear it",
    text:`I'm proud of you. I should say it more.\n\nI love how you laugh, how you get quiet when you're thinking, and how you still ask about my day when you're exhausted.\n\nI love who you are.` },
  { label:"Open when you miss me",
    text:`I miss you too, more than I probably say.\n\nI wish I could be there with you right now, even if we just sit together and do nothing.\n\nI’ll always be here be here for you.` }
];
/* --------------------------------------------------------------- */

document.getElementById("title").textContent = "For " + HER;
document.getElementById("intro").textContent = INTRO;
document.title = "For " + HER;
const wrap = document.getElementById("letters");
const dlg = document.getElementById("dlg"), body = document.getElementById("body"), sign = document.getElementById("sign");
let timer;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

LETTERS.forEach((l,i)=>{
  const b = document.createElement("button");
  b.className = "env";
  const s = document.createElement("small"); s.textContent = "Letter " + (i+1) + " of " + LETTERS.length;
  const t = document.createElement("span"); t.textContent = l.label;
  b.append(s,t);
  b.onclick = ()=>openLetter(l);
  wrap.appendChild(b);
});

function openLetter(l){
  clearInterval(timer);
  document.getElementById("dt").textContent = "Dear " + HER + ",";
  body.textContent = ""; sign.textContent = "";
  dlg.showModal();
  if(still){ body.textContent = l.text; sign.textContent = "Love you always.\n-" + ME; return; }
  let i = 0;
  timer = setInterval(()=>{
    body.textContent = l.text.slice(0, ++i);
    if(i >= l.text.length){ clearInterval(timer); sign.textContent = "Love you always.\n-" + ME; }
  }, 28);
}
function shut(){ clearInterval(timer); dlg.close(); }
document.getElementById("close").onclick = shut;
dlg.addEventListener("click", e=>{ if(e.target === dlg) shut(); });
dlg.addEventListener("close", ()=>clearInterval(timer));

/* lamp follows the finger/cursor, softly */
const g = document.getElementById("glow");
addEventListener("pointermove", e=>{
  g.style.setProperty("--x", e.clientX + "px");
  g.style.setProperty("--y", e.clientY + "px");
});
</script>
</body>
</html>
